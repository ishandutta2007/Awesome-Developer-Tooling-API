<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }
      .dash-flow {
        stroke-dasharray: 8, 12;
        animation: dash 20s linear infinite;
      }
      .float-orb {
        animation: floatOrb 8s infinite alternate ease-in-out;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #c084fc;
        letter-spacing: 0.5px;
      }
      .tech-pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #cbd5e1;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -400;
        }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0); }
        100% { transform: translate(30px, -20px); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Dynamic Orbs (Background layer) -->
  <g class="float-orb" opacity="0.35">
    <circle cx="150" cy="80" r="140" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="1060" cy="240" r="160" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="950" cy="60" r="100" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Dynamic Animated Graph Network Grid (Background layer) -->
  <g opacity="0.25">
    <line x1="80" y1="280" x2="320" y2="280" stroke="#60a5fa" stroke-width="1.5" class="dash-flow" />
    <line x1="320" y1="280" x2="520" y2="280" stroke="#818cf8" stroke-width="1.5" class="dash-flow" />
    <line x1="520" y1="280" x2="720" y2="280" stroke="#a78bfa" stroke-width="1.5" class="dash-flow" />
    <line x1="720" y1="280" x2="920" y2="280" stroke="#c084fc" stroke-width="1.5" class="dash-flow" />
    <line x1="920" y1="280" x2="1120" y2="280" stroke="#f472b6" stroke-width="1.5" class="dash-flow" />

    <line x1="160" y1="60" x2="400" y2="60" stroke="#3b82f6" stroke-width="1.5" class="dash-flow" />
    <line x1="680" y1="60" x2="1040" y2="60" stroke="#ec4899" stroke-width="1.5" class="dash-flow" />

    <!-- Subtle Connection Arcs -->
    <path d="M 120 280 Q 200 180 320 280" fill="none" stroke="#60a5fa" stroke-width="1" class="dash-flow" />
    <path d="M 520 280 Q 620 170 720 280" fill="none" stroke="#a78bfa" stroke-width="1" class="dash-flow" />
    <path d="M 820 280 Q 970 160 1080 280" fill="none" stroke="#f472b6" stroke-width="1" class="dash-flow" />

    <!-- Dynamic Pulsing Nodes -->
    <circle cx="120" cy="280" r="4" fill="#60a5fa" class="pulse-node" />
    <circle cx="320" cy="280" r="5" fill="#818cf8" class="pulse-node" />
    <circle cx="520" cy="280" r="4" fill="#a78bfa" class="pulse-node" />
    <circle cx="720" cy="280" r="5" fill="#c084fc" class="pulse-node" />
    <circle cx="920" cy="280" r="4" fill="#e879f9" class="pulse-node" />
    <circle cx="1080" cy="280" r="5" fill="#f472b6" class="pulse-node" />
  </g>

  <!-- Foreground Content: Top Pill Tag -->
  <g transform="translate(60, 42)">
    <rect width="270" height="30" rx="15" fill="url(#badge-grad)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="20" class="pill-text">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Foreground Content: Main Header and Subtitle -->
  <g transform="translate(60, 135)">
    <text class="title-text" fill="url(#title-grad)">Awesome Developer Tooling API</text>
    <text y="48" class="subtitle-text">Gateways, Lifecycle Management, Mocking, Testing &amp; Developer Experience</text>
  </g>

  <!-- Foreground Content: Feature Tech Badges -->
  <g transform="translate(60, 240)">
    <!-- Badge 1: API Gateways -->
    <g transform="translate(0, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="tech-pill-text">⚡ API Gateways</text>
    </g>

    <!-- Badge 2: Open Source -->
    <g transform="translate(162, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="tech-pill-text">🌐 Open Source</text>
    </g>

    <!-- Badge 3: SaaS Platforms -->
    <g transform="translate(319, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="tech-pill-text">☁️ SaaS Platforms</text>
    </g>

    <!-- Badge 4: Testing & Mocking -->
    <g transform="translate(486, 0)">
      <rect width="168" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="tech-pill-text">🧪 Testing &amp; Mocks</text>
    </g>

    <!-- Badge 5: OpenAPI & Specs -->
    <g transform="translate(666, 0)">
      <rect width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="tech-pill-text">📜 OpenAPI Specs</text>
    </g>

    <!-- Badge 6: CI/CD Automation -->
    <g transform="translate(838, 0)">
      <rect width="170" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" class="tech-pill-text">🚀 CI/CD Pipelines</text>
    </g>
  </g>

  <!-- Border Accent -->
  <rect width="1200" height="340" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
